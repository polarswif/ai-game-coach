spring.application.name=gamecoach
# Hosts like Render pick the port and pass it in PORT; 8080 when running locally.
server.port=${PORT:8080}

# Which implementations to use. Change these instead of editing code.
# Match data: "fake" = three built-in in-game scoreboards.
gamecoach.matches.source=fake
# Coaching: "fake" = canned feedback (free, no key). "claude" = real coaching from the Claude API.
gamecoach.coach.provider=fake

# Claude coach settings (used only when the provider is "claude").
# The key comes from the ANTHROPIC_API_KEY environment variable. Never put the key itself in this file:
# it's committed to Git, and anyone with the key can spend your credits.
gamecoach.claude.api-key=${ANTHROPIC_API_KEY:}
# claude-sonnet-5-5 is a good balance of quality and cost; claude-haiku-5-5 is much cheaper.
gamecoach.claude.model=claude-sonnet-5-5
# Caps the length (and so the cost) of each coaching reply. A typical reply uses about 1,000;
# 4,000 leaves room for a long match and costs at most about 4 cents of output on Sonnet 5.5.
gamecoach.claude.max-tokens=4000
# Reading a screenshot returns twelve rows of data, which can take close to a minute.
gamecoach.claude.timeout=120s

# Overwatch career stats come from OverFast API (free, no key). The public instance limits requests
# per second; for heavy use, self-host it with Docker and point this at your copy.
gamecoach.overfast.base-url=https://overfast-api.tekrop.fr
# A player OverFast hasn't cached yet means a fresh read of Blizzard's page, which can take a while.
gamecoach.overfast.timeout=20s

# Screenshot uploads. The Claude API takes images up to 5 MB; the app checks that itself and explains,
# so the server limit is set a little higher.
spring.servlet.multipart.max-file-size=10MB
# Overwatch uploads carry up to six screenshots in one request.
spring.servlet.multipart.max-request-size=30MB

# ---- Database ----
# Uploaded matches and their coaching are saved here, so a restart doesn't lose them and the same
# coaching is never paid for twice. Without settings, the app uses a small H2 database file in the
# ./data folder, fine for trying things out. To use PostgreSQL, set these environment variables in
# the run configuration (they override the lines below; never put the password in this file):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/gamecoach
#   SPRING_DATASOURCE_USERNAME=gamecoach
#   SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=jdbc:h2:file:./data/gamecoach
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates the tables from the @Entity classes at startup and adds new columns when an entity
# gains a field. ("update" never deletes data; bigger projects use migration tools like Flyway instead.)
spring.jpa.hibernate.ddl-auto=update
# Database work happens inside the stores, not while a web response is being written.
spring.jpa.open-in-view=false

# Accounts (invite-only). Set these as environment variables, never in this file:
#   GAMECOACH_INVITE_CODES   comma-separated sign-up codes, each usable once (e.g. code-for-alex,code-for-sam)
#   GAMECOACH_JWT_SECRET     a long random string (32+ characters) that signs login tokens
#   GAMECOACH_ALLOWED_ORIGINS the website's address when it's hosted elsewhere (e.g. https://you.github.io)
gamecoach.auth.invite-codes=${GAMECOACH_INVITE_CODES:}
gamecoach.auth.jwt-secret=${GAMECOACH_JWT_SECRET:}
gamecoach.auth.allowed-origins=${GAMECOACH_ALLOWED_ORIGINS:http://localhost:5173}
gamecoach.auth.token-lifetime=7d
gamecoach.auth.uploads-per-day=15
