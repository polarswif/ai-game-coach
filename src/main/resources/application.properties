spring.application.name=gamecoach

# Which implementations to use. Change these instead of editing code.
# Match data: "fake" = three built-in in-game scoreboards.
gamecoach.matches.source=fake
# Coaching: "fake" = canned feedback (free, no key). "claude" = real coaching from the Claude API.
gamecoach.coach.provider=fake

# Claude coach settings (used only when the provider is "claude").
# The key comes from the ANTHROPIC_API_KEY environment variable. Never put the key itself in this file:
# it's committed to Git, and anyone with the key can spend your credits.
gamecoach.claude.api-key=${ANTHROPIC_API_KEY:}
# claude-sonnet-5-5 is a good balance of quality and cost; claude-haiku-5-5 is much cheaper.
gamecoach.claude.model=claude-sonnet-5-5
# Caps the length (and so the cost) of each coaching reply. A typical reply uses about 1,000;
# 4,000 leaves room for a long match and costs at most about 4 cents of output on Sonnet 5.5.
gamecoach.claude.max-tokens=4000
# Reading a screenshot returns twelve rows of data, which can take close to a minute.
gamecoach.claude.timeout=120s

# Screenshot uploads. The Claude API takes images up to 5 MB; the app checks that itself and explains,
# so the server limit is set a little higher.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
