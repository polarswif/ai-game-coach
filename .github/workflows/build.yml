# Builds the project and runs every test on each push, using GitHub's servers.
name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run tests
        run: |
          set -o pipefail
          bash mvnw -B test 2>&1 | tee build.log
      # When something fails, turn the key lines into annotations, which show on the run's summary page.
      - name: Show what failed
        if: failure()
        run: |
          grep -E "^\[ERROR\]" build.log | grep -v -E "^\[ERROR\] *$|Re-run Maven|full stack trace|Help 1|-> \[Help" | head -8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          for f in target/surefire-reports/*.txt; do grep -A4 -E "<<< (FAILURE|ERROR)" "$f" | head -6 | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error::/'; echo; done 2>/dev/null | grep "::error::" | head -8 || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build the React app
        run: |
          npm install
          npm run build

  # Builds the server's Docker image the same way the host will, so a broken Dockerfile shows up here first.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t game-coach-api .
      - name: Start it and check it answers
        run: |
          docker run -d --name api -p 8080:8080 game-coach-api
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/rivals/heroes > /dev/null; then echo "Server is up"; exit 0; fi
            sleep 2
          done
          docker logs api | tail -40
          exit 1
